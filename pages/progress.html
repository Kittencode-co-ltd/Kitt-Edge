<div class="page" id="progressPage">
    <div class="page-header">
        <h2>📊 ผลการเรียน</h2>
    </div>

    <!-- Summary Strip -->
    <div class="dev-summary-strip" id="devSummary">
        <!-- Dynamic -->
    </div>

    <!-- Chart: before/after per chapter -->
    <div class="chart-card dev-chart-card">
        <div class="dev-chart-header">
            <h3>ภาพรวมพัฒนาการ</h3>
            <div class="dev-legend">
                <span class="legend-dot pre"></span><span>ก่อนเรียน</span>
                <span class="legend-dot post"></span><span>หลังเรียน</span>
            </div>
        </div>
        <div style="position:relative; height:180px;">
            <canvas id="devChart"></canvas>
        </div>
    </div>

    <!-- Chart: predicted score trend -->
    <div class="chart-card dev-chart-card">
        <div class="dev-chart-header">
            <h3>คาดคะเนคะแนนในอนาคต</h3>
            <div class="dev-legend">
                <span class="legend-dot actual"></span><span>คะแนนจริง</span>
                <span class="legend-dot predicted"></span><span>คาดคะเน</span>
            </div>
        </div>
        <div style="position:relative; height:180px;">
            <canvas id="predictChart"></canvas>
        </div>
        <div class="predict-hint" id="predictHint"></div>
    </div>

    <!-- Strengths & weaknesses by topic -->
    <div class="dev-section-label">จุดแข็งและจุดที่ควรพัฒนา</div>
    <div id="insightSection">
        <!-- Dynamic -->
    </div>

    <div style="height:80px"></div>
</div>
