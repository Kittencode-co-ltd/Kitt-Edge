<div class="page" id="authPage" style="overflow-y:auto; height:100%;">

    <!-- Hero header -->
    <div class="auth-hero">
        <div class="auth-hero-glow"></div>
        <div class="auth-hero-content">
            <div class="auth-logo-wrap">
                <img src="img/logo.png" alt="Kitt-Edge" style="width:72px;height:72px;object-fit:contain;">
            </div>
            <h1 class="auth-app-name">Kitt-Edge</h1>
            <p class="auth-tagline">ระบบวัดและประเมินผลการเรียนรู้<br>ก่อนเรียน — หลังเรียน</p>
        </div>
        <!-- Decorative circles -->
        <div class="auth-deco auth-deco-1"></div>
        <div class="auth-deco auth-deco-2"></div>
        <div class="auth-deco auth-deco-3"></div>
    </div>

    <!-- Form card -->
    <div class="auth-card">
        <h2 class="auth-card-title">เข้าสู่ระบบ</h2>
        <p class="auth-card-sub">ใช้ชื่อผู้ใช้และรหัสผ่านที่ได้รับจากครู</p>

        <div id="loginForm" class="auth-form active">

            <div class="auth-input-group">
                <div class="auth-input-icon"><i class="fas fa-user"></i></div>
                <input type="text" placeholder="ชื่อผู้ใช้" class="auth-input-field">
            </div>

            <div class="auth-input-group">
                <div class="auth-input-icon"><i class="fas fa-lock"></i></div>
                <input type="password" placeholder="รหัสผ่าน" class="auth-input-field" id="authPassword">
                <button class="auth-eye-btn" onclick="AuthApp.togglePassword()" type="button">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <div class="auth-forgot">
                <a href="#">ลืมรหัสผ่าน?</a>
            </div>

            <button class="auth-login-btn" onclick="AuthApp.login()">
                <i class="fas fa-arrow-right-to-bracket"></i>
                เข้าสู่ระบบ
            </button>
        </div>
    </div>

</div>
